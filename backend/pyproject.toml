[project]
name = "bizwithagents-backend"
version = "0.1.0"
description = "BizWithAgents backend — template fullstack + AI agent"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi (>=0.141.1,<0.142.0)", "uvicorn[standard] (>=0.53.0,<0.54.0)", "pydantic-settings (>=2.15.0,<3.0.0)", "sqlmodel (>=0.0.47,<0.0.48)", "sqlalchemy[asyncio] (>=2.0.54,<3.0.0)", "psycopg[binary,pool] (>=3.3.6,<4.0.0)", "pymongo (>=4.18.1,<5.0.0)", "redis (>=8.1.0,<9.0.0)", "httpx2 (>=2.13.1,<3.0.0)", "typer (>=0.27.2,<0.28.0)", "pyyaml (>=6.0.3,<7.0.0)", "greenlet (>=3.5.6,<4.0.0)", "alembic (>=1.20.0,<2.0.0)", "faststream[rabbit] (>=0.7.7,<0.8.0)", "taskiq (>=0.12.6,<0.13.0)", "taskiq-aio-pika (>=0.6.1,<0.7.0)", "pyjwt[crypto] (>=2.15.0,<3.0.0)", "beanie (>=2.2.0,<3.0.0)", "cryptography (>=50.0.1,<51.0.0)", "tzdata (>=2026.4,<2027.0)", "pwdlib[argon2] (>=0.3.1,<0.4.0)", "langchain (>=1.4.2,<2.0.0)", "langgraph (>=1.2.12,<2.0.0)", "langchain-openai (>=1.6.6,<2.0.0)", "langchain-anthropic (>=1.7.4,<2.0.0)", "langchain-google-genai (>=4.4.0,<5.0.0)", "langgraph-checkpoint-postgres (>=3.1.2,<4.0.0)", "aiosmtplib (>=4.0,<6.0)", "jinja2 (>=3.1,<4.0)"]

[project.scripts]
bw = "app.cli:main"

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests", "../scripts/tests"]
pythonpath = [".", "../scripts"]
markers = ["integration: cần Postgres / Mongo / Redis / RabbitMQ local (xem .claude/deploy/CLAUDE.md)"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["../scripts/scaffold/templates"]  # mẫu có token `__mod__` — file sinh ra mới được lint

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "docsite"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "markdown-it-py (>=4.2.0,<5.0.0)",
    "pygments (>=2.21.0,<3.0.0)",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
