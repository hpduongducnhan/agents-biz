<!doctype html>
<html lang="vi"><body style="margin:0;padding:24px;background:#FFF7ED;font-family:Nunito,Segoe UI,Arial,sans-serif;color:#1C1745">
<div style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:16px;padding:24px">
<p style="line-height:1.6">Chào {{ name }},</p>
<p style="line-height:1.6">Ai đó (có thể là bạn) vừa yêu cầu đặt lại mật khẩu. Bấm link dưới đây để đặt mật khẩu mới (link dùng một lần, hết hạn sau {{ minutes }} phút):</p>
<p style="margin:24px 0"><a href="{{ link }}" style="background:#4F40DD;color:#FFFFFF;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700">Đặt mật khẩu mới</a></p>
<p style="font-size:12px;color:#5B5680;word-break:break-all">{{ link }}</p>
<p style="line-height:1.6">Nếu không phải bạn, hãy bỏ qua thư này — mật khẩu hiện tại vẫn giữ nguyên.</p>
<p style="font-size:12px;color:#5B5680">{{ app_name }}</p></div></body></html>
